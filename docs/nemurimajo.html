<head>

<title>眠り魔女のことば｜項目べつアーカイブ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --bg:#faf6f3; --card:#fffdfc; --ink:#4a3f42; --soft:#8b7a7e;
  --rose:#b3697f; --rose-deep:#96506a; --rose-pale:#f7e7ec; --rose-mist:#fcf3f6;
  --gold:#c0a173; --line:#eeded9;
  --serif:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --sans:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.9;
  background-image:radial-gradient(ellipse 90% 45% at 50% -8%, #f6e6ec 0%, transparent 62%)}
.wrap{max-width:660px;margin:0 auto;padding:0 18px 90px}

header{text-align:center;padding:32px 0 14px}
.moon{display:inline-flex;align-items:center;justify-content:center;width:54px;height:54px;
  border:1.5px solid var(--rose);border-radius:50%;background:var(--card);
  font-size:22px;margin-bottom:10px}
h1{font-family:var(--serif);font-weight:500;font-size:23px;letter-spacing:.12em}
.tagline{font-size:11.5px;color:var(--soft);letter-spacing:.2em;margin-top:6px}
.tagline::before,.tagline::after{content:"—";margin:0 9px;color:var(--gold)}

nav{position:sticky;top:0;z-index:20;background:rgba(250,246,243,.93);backdrop-filter:blur(8px);
  display:flex;gap:6px;justify-content:center;flex-wrap:wrap;padding:10px 0 13px;margin-bottom:6px}
nav button{font-family:var(--sans);font-size:13px;letter-spacing:.06em;color:var(--soft);
  background:var(--card);border:1px solid var(--line);border-radius:999px;
  padding:8px 16px;cursor:pointer;transition:all .2s}
nav button.on{background:var(--rose);border-color:var(--rose);color:#fff;
  box-shadow:0 3px 10px rgba(179,105,127,.28)}

.label{font-size:11.5px;letter-spacing:.24em;color:var(--rose);text-align:center;margin:22px 0 14px}
.label::before,.label::after{content:"·";margin:0 11px;color:var(--gold)}
.hint{text-align:center;font-size:12.5px;color:var(--soft);margin:24px 0;line-height:2}

/* 項目カード */
.themes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(min-width:540px){.themes{grid-template-columns:1fr 1fr 1fr}}
.theme{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 12px;
  text-align:center;cursor:pointer;transition:all .2s}
.theme:hover{border-color:var(--rose);box-shadow:0 5px 16px rgba(179,105,127,.13);transform:translateY(-2px)}
.theme .ic{font-size:19px;display:block;margin-bottom:5px}
.theme .nm{font-family:var(--serif);font-size:14.5px;color:var(--rose-deep);letter-spacing:.03em}
.theme .ct{font-size:10.5px;color:var(--gold);margin-top:3px;letter-spacing:.08em}
.theme .ds{font-size:10.5px;color:var(--soft);margin-top:6px;line-height:1.65}

/* 一覧の行 */
.row{display:flex;align-items:flex-start;gap:13px;background:var(--card);border:1px solid var(--line);
  border-radius:13px;padding:13px 16px;margin-bottom:8px;cursor:pointer;transition:all .15s}
.row:hover{border-color:var(--rose);transform:translateY(-1px)}
.row .dt{font-family:var(--serif);font-size:12px;color:var(--gold);min-width:62px;
  letter-spacing:.03em;padding-top:3px}
.row .tx{flex:1;font-size:14px;line-height:1.7}
.row .tx .sub{display:block;font-size:10.5px;color:var(--soft);margin-top:3px;letter-spacing:.06em}
.row .bk{color:var(--rose);font-size:14px;padding-top:2px}

/* 本文 */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;
  box-shadow:0 4px 18px rgba(120,80,85,.06);padding:26px 24px;margin-bottom:14px}
.post .meta{text-align:center;font-family:var(--serif);font-size:12.5px;color:var(--soft);
  letter-spacing:.1em;margin-bottom:6px}
.post h2{font-family:var(--serif);font-weight:500;font-size:19px;line-height:1.75;text-align:center;
  color:var(--rose-deep);margin:2px 0 10px;letter-spacing:.03em}
.post .chip{display:block;text-align:center;font-size:10.5px;color:var(--soft);letter-spacing:.13em;
  margin-bottom:16px}
.post .rule{width:54px;height:1px;background:var(--gold);margin:0 auto 22px;opacity:.6}
.post .body{font-family:var(--serif);font-size:15.5px;line-height:2.2;letter-spacing:.02em}
.post .body p{margin-bottom:1.3em}
.post .body ol{padding-left:1.5em;margin-bottom:1.3em}
.post .body ol li{margin-bottom:.5em}
.post .body blockquote{color:var(--soft);font-size:14px;text-align:center;font-family:var(--sans)}
.post .link{display:block;text-align:center;font-size:11.5px;color:var(--gold);
  letter-spacing:.08em;margin-top:24px;text-decoration:none}
.post .link:hover{color:var(--rose)}

.pager{display:flex;justify-content:space-between;align-items:center;gap:9px;margin-top:6px}
.pager button{font-family:var(--sans);font-size:12.5px;color:var(--rose-deep);background:var(--card);
  border:1px solid var(--line);border-radius:999px;padding:9px 16px;cursor:pointer}
.pager button:disabled{opacity:.3;cursor:default}
.mark{font-size:12.5px;border-radius:999px;border:1px solid var(--rose-pale);background:var(--rose-mist);
  color:var(--rose-deep);padding:9px 16px;cursor:pointer;font-family:var(--sans)}
.mark.on{background:var(--rose);color:#fff;border-color:var(--rose)}

.back{display:inline-block;font-size:12.5px;color:var(--rose-deep);cursor:pointer;margin-bottom:12px;
  background:none;border:none;font-family:var(--sans)}
.head{text-align:center;margin-bottom:14px}
.head .nm{font-family:var(--serif);font-size:20px;color:var(--rose-deep);letter-spacing:.08em}
.head .ds{font-size:12px;color:var(--soft);margin-top:3px}

.search{display:flex;margin-bottom:16px}
.search input{flex:1;font-family:var(--sans);font-size:15px;padding:12px 18px;border:1px solid var(--line);
  border-radius:999px;background:var(--card);color:var(--ink);outline:none}
.search input:focus{border-color:var(--rose)}

.omakase{display:block;margin:2px auto 0;background:none;border:none;color:var(--gold);
  font-size:11.5px;letter-spacing:.13em;cursor:pointer;font-family:var(--sans);padding:8px}
.omakase:hover{color:var(--rose)}
footer{text-align:center;font-size:10.5px;color:var(--soft);letter-spacing:.1em;margin-top:38px;line-height:2}
</style>

ターンを見抜くようにしましょう\nあなたにとって正しい人は前に進めさせてくれて\n違う人は足を引っ張ろうとします\n常に自分の近くに置く5人の人の存在を間違えないようにしてください","th":"kyoukai"},{"d":"2026-06-13","u":"https://www.instagram.com/p/DZhbTjhz3-j/","k":"リール","l":2846,"c":19,"v":1,"t":"ものにではなく環境にお金を使うことが人生を静か…","b":"ものにではなく環境にお金を使うことが人生を静かに確実に変えていく7つの秘密\n1.会う人を意図的に変える\n2.言葉のレベルが自然と上がる場所に行く\n3.当たり前の基準というものを高い空間に見置くこと\n4.収入の少ない多いではなくお金の話を正直にできる友人を持つこと\n5.少し背伸びすれば届く環境に飛び込む\n6.消費ではなく学びにお金を向ける\n7.安く住んだを誇らしいと感じなくなること\nあなたがいる環境はあなたの当たり前を作っています\n浅く安い場所に長くいればそれがあなたの基準となります\n少しでも高い場所へ身を置くだけで見える景色と自分への期待値が変わります\n環境を買うとは未来の自分への一番地味で一番効果のある先行投資です","th":"yutakasa"},{"d":"2026-06-11","u":"https://www.instagram.com/p/DZcLGqvT9lr/","k":"リール","l":1107,"c":2,"v":1,"t":"皆さんはマイクロプラスチックはどのような経路で…","b":"皆さんはマイクロプラスチックはどのような経路で体に入ってくるか知っていますか?\n一番は食べ物です。\n商品の包装や商品に直接触れていることが一番の原因だと考えられています。\nそして見落とされがちなのが皮膚からの吸収です。\n例えばランニングウェアやヨガウェア、女性だとナプキンもそうですね。\nこれらは肌に密着する素材が多く、さらにこうした製品は長年の開発の中で主にポリエステルやナイロンで作られるようになりました。\nこれはあくまで一例にすぎませんが化粧品なども分けられます\n様々な成分は皮膚から意外と簡単に吸収され\nさらにレシートなどの乾熱紙はビスフェノールを取り込む大きな原因となっています\n私たちは日常にその髪に触れています\n特に手先消毒剤やアルコールハンドクリームなどを使った後は\n皮膚からの吸収がさらに進みやすくなることも分かっています\n最終的には血液の中に入り込み肝臓を通らず吸収されるのです\nそのために体内を最初に巡る段階でより大きな影響を与える可能性がある\nそれがマイクロプラスチックです\n何を身につけ何を食すか\nこれらは自分である程度選択ができるものです\n未来の自分や家族のために良い選択を","th":"koudou"},{"d":"2026-06-08","u":"https://www.instagram.com/p/DZUdHG0zMkg/","k":"リール","l":2136,"c":36,"v":1,"t":"あなたがすれ違う誰もが","b":"あなたがすれ違う誰もが、あなたには見えない戦いを抱えています。\nほとんど目を合わせなかったレジの店員さんは、もしかしたら今月どうやって家賃を払おうか悩んでいるかもしれません。\n最近、元気のなさそうな同僚も、もっと一緒にいられると思っていた大切な人を失ったばかりかもしれない。\nまた、予定をキャンセルされた友人も、1日を乗り切るだけで精一杯なのかもしれない。\n私たちの周りでは人前で壊れてしまわないように必死に踏ん張っている人がたくさんいます\nなので決めつける前にほんの少しの優しさと思いやりを持ち\n少しだけでもいい優しい言葉や態度で話してみてください\nなぜならその人があなたと出会う前の朝\n何を乗り越えてきたのか私たちにはわからないからです\nその気持ちさえあれば優しい輪が少しでも広がっていくと思っています","th":"kotoba"},{"d":"2026-06-05","u":"https://www.instagram.com/p/DZMvS9Xzrp7/","k":"リール","l":716,"c":2,"v":0,"t":"（音声なしの投稿）","b":"> （発話なし・BGMのみ）","th":"sonota"},{"d":"2026-06-03","u":"https://www.instagram.com/p/DZHlImCz87h/","k":"リール","l":1354,"c":13,"v":1,"t":"あなたは毎日、脳にどんな言葉を投げかけています…","b":"あなたは毎日、脳にどんな言葉を投げかけていますか?\n脳は真実かどうかではなく、繰り返したものを信じます。\nこれは、錯覚真実効果と呼ばれているもので、\n思考が感情を生み、感情が行動を生んで、行動がアイデンティティを継続します。\nすなわち、脳はこの瞬間にも書き換わっているのです。\nなので、自分に書ける言葉はとても重要です。\n繰り返す言葉の一つ一つが、脳と体をプログラムしています。\n前向きな言葉は強さを育て\n有害な言葉は自分への信頼を壊していきます\nこれは反復条件付けで\n脳は繰り返し聞いた言葉を真実として受け止めるのです\nそして人は自分の自己イメージ以上にはなれないのです\nさらに脳は現実と想像を完全に区別していないことも分かっています\nだからこそなりたい自分を思い描き\n言葉にし行動に移すのです\nそうすることで自分自身を成功へ向けて常に書き換えていくのです\n人間の行動の95%は無意識と言われています\nつまり脳は未来を予測するようなマシンのようなもの\nだからこそいいデータを脳に与え続けてください\nもし入力された言葉そのものを変えることができれば現実も変えられるからです\nそれとともに何度もお伝えしていますが\n言葉だけではなくそれに伴う行動も一緒に行うことが何よりも重要なことです\nありがとうございました。","th":"kotoba"},{"d":"2026-05-27","u":"https://www.instagram.com/p/DY1ju_7TleH/","k":"リール","l":3054,"c":37,"v":1,"t":"人生で選んではいけないもの","b":"人生で選んではいけないもの、どちらが正しく誰が上かのような競争はもうしてはいけません。\n勝ち負けで人を見るほど心はすり減っていきます。\n他人の評価に振り回される生き方も手放すのです。\n褒められるかどうかで選ぶ必要はありません。\n人生を進んでいくにあたり、選ばなくていいことがたくさんあることがわかります。\n無理をする関係、意味のない我慢、終わらない比較、これらを続けるほど人生は重くなってしまいます。\n本当に選ぶべきことは静かでシンプルです\n心が穏やかでいられる場所\n無理をしなくていい人\n自分らしくいられる時間\nそれだけで十分なのです\n人生は進むにつれて何を増やすかではなく\n何を選ばないかで決まります","th":"tebanasu"},{"d":"2026-05-24","u":"https://www.instagram.com/p/DYt2Ytok_xu/","k":"カルーセル","l":272,"c":1,"v":0,"t":"（音声なしの投稿）","b":"> （音声トラックなし／静止画投稿）","th":"sonota"},{"d":"2026-05-21","u":"https://www.instagram.com/p/DYmKIf0E0EB/","k":"カルーセル","l":211,"c":0,"v":0,"t":"（音声なしの投稿）","b":"> （音声トラックなし／静止画投稿）","th":"sonota"},{"d":"2026-05-21","u":"https://www.instagram.com/p/DYmGXptzgU-/","k":"リール","l":8918,"c":22,"v":1,"t":"現代とても便利なスマートフォンですが","b":"現代とても便利なスマートフォンですが、これは意図的に中毒になるよう作られていることを知っていますが、\niPhoneの説明の中にも、がんを防ぐためにどれくらい体から離して使用するべきかなどを記載されています。\nこれは私たちでも確認ができることです。\n設定のアプリを開き、バン、下までスクロールをすると、法律に基づく情報及び認証という項目が出てきます。\nそこを開くと一番下の項目に\n口周波暴露という項目があります\nこれはリエクスポージャー電磁波暴露のことが記載されています\n主に本機は体から5mmの距離を保ち使用する必要がある\nといったような内容が記載されています\nつまりメーカーはあなたがスマホを体に密着させたことで\n病気になったとしても責任は取らないということです\n例えば最近では若い男性の間では\nスマホをズボンの前ポケットに入れ続けることで、清掃がんの発症率が上昇しており、女性は胸ポケットに入れる習慣があった人などから、リチウムバッテリーの形に沿った乳がんが発生したケースもありました。\nその他、子供の成長や思考力に与える影響の研究結果もたくさん出てきています。\n現代社会でスマートフォンは生活の一部となった今、その影響について考えるべき時なのかもしれません。\nリスクを完全になくすことは難しくても、日々のちょっとした工夫でより賢く、安全に付き合うことは可能です。","th":"koudou"},{"d":"2026-05-19","u":"https://www.instagram.com/p/DYhAcs2kyXu/","k":"カルーセル","l":261,"c":0,"v":0,"t":"（音声なしの投稿）","b":"> （音声トラックなし／静止画投稿）","th":"sonota"},{"d":"2026-05-17","u":"https://www.instagram.com/p/DYb0DgiT300/","k":"リール","l":2636,"c":10,"v":1,"t":"男性は太陽周期、女性は月周期","b":"男性は太陽周期、女性は月周期\n男性はテストステロンサイクルにより24時間の太陽周期で生きています\n一方女性は28日間のホルモンサイクル\n月周期の28日間に合わせてホルモンが変化していきます\n月の満ち欠けと同じ、おおよそ13日の周期で排卵や生理がきますよね\nですので、朝9時から18時のような男性の24時間をサイクルとした太陽周期に基づいた働き方だと、月の周期で動く女性の体や心が不調になるのは当たり前なのです。\n現代の女性たちが月の暦を意識して、心穏やかに自分の好きなことで生きて、心身ともに休める豊かな環境で生きていけば、世の中の問題はほとんどが解決すると思っています。\n満潮や寒潮、満月新月と同じサイクルで生理や排卵が起こり\n女性たちのエネルギーを解放し\n本来のニュートラルな自分に戻れるよう\n月の暦と生きる\n私は自分の作る商品や発信を通して\n美しい女性の皆さんが\n月の暦を意識した生き方のお手伝いができればと思っています","th":"karada"},{"d":"2026-05-15","u":"https://www.instagram.com/p/DYWsv17zuvi/","k":"リール","l":1210,"c":16,"v":0,"t":"（音声なしの投稿）","b":"> （発話なし・BGMのみ）","th":"sonota"},{"d":"2026-05-14","u":"https://www.instagram.com/p/DYUFokfTpua/","k":"リール","l":2275,"c":24,"v":1,"t":"5月17日の新月は一流万倍日と重なる日です","b":"5月17日の新月は一流万倍日と重なる日です\n新月は物事を終わらせる力や手放す、リセットするような力が非常に強いタイミングと言われ\n一流万倍日は蒔いた種が1万倍になると言われています\nこの2つが重なる日に向けて、今日からの準備期間、皆様に行ってほしいことが2つあります\n1つ目、手放すものを1つだけ紙に書いて捨てます\n感情や習慣、人間関係、仕事、何でも構いません\n〇〇は持っていかないと簡潔に書き、折りたたみ、そして捨てます\n新月は終わらせる力が際立つ日\n手放すことで何か新しいものが入り込む隙間を生みます\n2つ目、まく種を一文で書いていきます\n〇〇したい、や〇〇できますように、ではなく\n何々した\nしているというように書き\n17日にその紙を読み返します\n一流万倍日はそれが1万倍となる日\n準備した人とそうしなかった人では\n1ヶ月後の流れがきっと変わっています\n手放し招き入れる\nそしてその願いや祈りのために行動を伴わせます\n素敵な種から育ちますように","th":"tebanasu"},{"d":"2026-05-12","u":"https://www.instagram.com/p/DYO8F8DzcrM/","k":"リール","l":2402,"c":32,"v":1,"t":"日本人は人類で最も回復力のある民族と言われてい…","b":"日本人は人類で最も回復力のある民族と言われているのを知っていますが、回復というのは身体的なものではなく、これまでの日本が辿ってきた歴史としての復活についてです。\n日本は小さな国でありながら、今まで成し遂げてきたのは驚異的です。\n例えば、13世紀はモンゴル帝国が2度の侵略を試みます。\nその当時の日本は国内で分断され国土を奪い合うような時代でしたが、人々は団結し、その信仰を退けました。\nモンゴル帝国といえば当時は世界最大の帝国だったのです\nまた19世紀中国が西洋列強に分断される中\n日本も同じ運命をたどるように見えましたが\n明治維新を経て工業化を進め\nわずか30から40年でロシアに追いついたのです\nそれは当時誰も想像すらできなかったこと\nそして1945年アメリカは日本を焼夷弾で攻撃し\nインフラと産業を破壊\n何百人もの人々が犠牲となりました\nそして2発の原子爆弾が投下されたのも記憶に新しいです\nそれでも戦後わずか1世代で日本は世界有数の製造大国として復活していくのです\n現在世界中で様々な問題が起こっている中\n私たち日本人は素晴らしい魂と体、心を持っています\nそのエネルギーをどこに向けるかによって\n私たち自身も気づかないような素晴らしい世界を想像していけると思っています","th":"kotoba"},{"d":"2026-05-10","u":"https://www.instagram.com/p/DYJywFkzpR3/","k":"リール","l":1270,"c":16,"v":1,"t":"皆さんは知性と聞いて何を思い浮かべますか?","b":"皆さんは知性と聞いて何を思い浮かべますか?\nきっとIQや記憶力、論理力の高さを思い浮かべる方が多いと思います\n神経科学における知性の最高の形は全く異なります\nほとんどの人はこれを発達させることがなく\nしかしそれを身につけた人は周囲の人々を超えていきます\nその知性の最高の形とはメタ認知です\nメタ認知とは自分の思考そのものを客観的に考える力\n無意識に反応するものでもなく、自動運転のまま生きるものでもありません。\nつまり、自分の心の動きをリアルタイムで観察することで、自分の思考に気づき、自分の反応を問い直す。\n感情的な反射を一度止め、信念を守るのではなく、自分の思考を一歩引いて観察し、アップデートしていくことを意味しています。\nなぜ、あの時、私はあのような反応をしたのか、そのように問いかけるたびに、脳は変化、進化をし始めます。\n神経科学の研究では自分の思考を観察すると前頭前夜と呼ばれる領域が活性化することを発見しました\nこの領域は行動や感情のためでもない自己観察をするための領域と言われています\nこれは動作しながら自分自身のオーロープログラムを書き換えるコンピューターのようなものです\nなので自己認知の高い人は他の人よりも早く成長していくのです\nこれは単なる自己啓発的な精神論ではありません\n意識が脳のファイルシステムを書き換える神経回路が再構築されるプロセス\n多くの人がこれを発達させないのは\n実はメタ認知は私たちの脳にとっては非常に不快なプロセスだからです\n反応する代わりに立ち止まり防御する代わりに問い直し\n自身の失敗を素直に感情を抜きに見つめることが求められます\nあなたは普段自分の思考をどのくらい観察しますか\nアインデー","th":"kokoro"},{"d":"2026-05-07","u":"https://www.instagram.com/p/DYCE02zTTJe/","k":"リール","l":4471,"c":23,"v":1,"t":"どれだけ親しくても絶対に口にしてはいけない7つ…","b":"どれだけ親しくても絶対に口にしてはいけない7つのこと\n1.お金の話\n多いと妬まれ、少ないと見下される\n具体的な数字は出すべきではありません\n2.怒りの言葉\n感情のままにぶつけた言葉は相手にずっと残り続けます\n3.他人の悪口\nその場は盛り上がるかもしれませんが\nお互いの信頼は確実に下がります\n4.過去の失敗の蒸し返し\n終わったことを繰り返すほど関係は前に進みません\n5.上からのアドバイス\n求められていない助言は押し付けになります\n正しさよりタイミングが大事\n6.比較するような言葉\n誰かと比べることは相手の価値を下げてしまいます\n無意識でも相手を大きく傷つけてしまうのです\n7.軽い冗談のつもりの一言\n言った側は忘れるほどの冗談でも言われた側は覚えています\n親しさに甘えるほど言葉は雑になります\n長く続く関係は言わない優しさでも守られています","th":"kyoukai"},{"d":"2026-05-05","u":"https://www.instagram.com/p/DX87MowTudR/","k":"リール","l":2003,"c":31,"v":1,"t":"LED電球が体に与える影響はアスベストと同じレ…","b":"LED電球が体に与える影響はアスベストと同じレベルだと知っていますか?\nLEDには大きなブルーライトのピークがあります。\nこれは暖色系のLEDでも同じです。\nLEDの光の下では、ミトコンドリアの機能が徐々に低下していく様子が確認されているのです。\nLEDライトは今や家庭ではもちろん、商用施設でも多く使用され、\n同程度の照度環境においても同様と考えられています。\n皆さんも感じたことがあるかもしれませんがLEDにはちらつきがありそれが人間の闘争反応を過剰に刺激する可能性もあるとのことです\nLEDライトに長時間晒されることで私たちのエネルギー回復や疲労感の増加回復の低下というような影響につながります\nしかし私たち人間は日光へ当たる時間が多いほど寿命が長い傾向にあるということも明確に知られています\nLEDの環境から今すぐ全て離れることは今の時代難しいかもしれません\nだからこそ朝自然光を浴び夜はLEDではない照明で過ごすことをお勧めします\n自宅を優しい明かりに変えるだけでも自身の体の変化を感じそして守ることができるかもしれません","th":"kyoukai"},{"d":"2026-05-03","u":"https://www.instagram.com/p/DX3wY1zT9td/","k":"リール","l":1503,"c":13,"v":1,"t":"陰陽の法則って知っていますか?","b":"陰陽の法則って知っていますか?\n陰陽は、いい、悪い、ではなく、世界が成り立つ二つで一つの仕組みです。\n陽は、動く、外に出る、熱、昼、上、明るさ。\n陰は、休む、家に入る、冷え、夜、下、静けさ。\nどちらかが正しい、ではなく、陰が深まるから陽が生まれ、陽が極まると陰に戻る。\n季節が巡るように呼吸を吸って吐くように\n感情もお仕事も人間関係もこのリズムで揺れています\n落ちる時期は陰が育つ時\n焦らず整えるほど次の陽が自然に立ち上がります\n陰陽の法則を理解すれば今よりもきっと生きやすくなります","th":"kyoukai"},{"d":"2026-05-01","u":"https://www.instagram.com/p/DXyoL-mzX0C/","k":"リール","l":12687,"c":39,"v":1,"t":"砂糖と免疫の関係を知っていますか?","b":"砂糖と免疫の関係を知っていますか?\n砂糖を摂取し、体内に入ると骨髄に入り込むことが70年前の研究より知られています。\nそして、摂取から45分以内に、細菌、寄生虫、ウイルスなどの感染と戦う白血球を作る能力を抑制すると言われています。\nこれは文字通り、免疫システムを停止させ、あらゆるウイルスや感染症にかかりやすくなると言われています。\nさらに、砂糖はプレトニゾンと比較されます。\nプレトニゾンの役割は免疫システムを抑制すること\n実際に免疫抑制剤と呼ばれています\nつまり何が言いたいかというと\n砂糖はそのプレトニゾンよりも強く免疫を抑制するとも言われているということです\nなのでもしあなたが感染症と戦おうとしている場合や\n様々なウイルスなどを心配しているのに\n朝からパンケーキやシリアル、ドーナツなどを食べているのであれば\nそれは自分の健康を大切にしていないということになります\nこのような知識を持つことで、毎日の小さな選択を変えられ、長期的な健康につなげることができるかもしれません","th":"karada"},{"d":"2026-04-30","u":"https://www.instagram.com/p/DXwDFKOT47n/","k":"リール","l":1633,"c":25,"v":1,"t":"人生の時間を無駄にしてしまっている人の7つの行…","b":"人生の時間を無駄にしてしまっている人の7つの行動と人生の変え方\n1.好きでもない活動に毎日の時間を使う\n2.いつか好きなことをやるを繰り返す\n3.他人の期待に応えることに全力を使う\n4.批判を恐れて本当にやりたいことは戸回しにする\n5.安定を守るために成長を諦める\n6.今日よりいつかを大切にする\n7.死ぬ前に後悔することが分かっているのに動かない\n何かを始めるにあたり心の準備ができたと感じることはありません\n飛び込めるという感覚が完全にできることはありません\n私たちの脳は私たち自身を守るようにできています\n変化とはリスクを伴いますよね\nだからこそ明日からでいいやと自分を守ろうとしているのです\nしかし私たちの時間は有限です\n少しでも人生を変えることを望むのであれば\n人生を変えると決断し\n行動を今すぐにでも始めるのです","th":"koudou"},{"d":"2026-04-28","u":"https://www.instagram.com/p/DXq-FqGE5JD/","k":"リール","l":1514,"c":17,"v":1,"t":"自宅でできる3つの浄化方法","b":"自宅でできる3つの浄化方法\n最近なんだかついていない、うまくいかない、家にいると気が重いなどを感じられるのは\nもしかしたら気が溜まっているのが原因かもしれません\n1つ目、換気で流れを作ります\n玄関と窓を1箇所ずつ開け、5分から10分ほど空気の通り道を作ります\n空気が動くことで、部屋に溜まった重さが外へ抜けやすくなります\nこれは朝一番か帰宅直後に行うことが効果が高いです\n2つ目、拍手を打つ\n部屋の四隅に向かって2拍手します\n音の振動が停滞した邪気を減らしてくれます\nこれも朝一番で行うと効果が高いです\nそして3つ目、水拭きに塩を入れる\nボールやバケツにアラジオを一つまみ程度溶かし床を拭きます\n足元から溜まる重い邪気を落としてくれます\nこの3つを定期的に続けることで\n家の空気が変わり気が巡ります\n最近何かが停滞していると感じる方は\nぜひ試してみてください","th":"koudou"},{"d":"2026-04-25","u":"https://www.instagram.com/p/DXjKhkxE3F2/","k":"リール","l":1204,"c":13,"v":1,"t":"人生における7つの真実","b":"人生における7つの真実\n1つ目、他人の人生と自分を比較することは最も簡単に落ち込む方法です\n2つ目、自分一人の力で全ての人を幸せにすることはできません\nもしそうすれば自分自身を見失ってしまいます\n3つ目、人から好かれていないことを気にしなくて大丈夫\nなぜならほとんどの人は自分自身すら愛すことができていないから\n4つ目、この世界であなたに貸している唯一の制限は、あなた自身のマインドだけ\n5つ目、あなたの夢を潰す最大の要因は、他者のあなたに対する意見への執着です\n20代では他人の自分に対する意見を気にしすぎ、40代でようやく他人のことを気にしなくなり、そして60代になるとそもそも誰もあなたのことを考えていなかったことにやっと気がつくのです\n6つ目、お金はゴールではなく人生の選択を増やすための道具の一つ。いくら稼ぐかも大事かもしれませんが、どれだけ保持し、そしてそのお金を次なる投資へどう生かせるかどうかということです。\n最後に7つ目、世界で最も危険なのは快適にさせられること。","th":"yutakasa"},{"d":"2026-04-23","u":"https://www.instagram.com/p/DXeDEdqk9eJ/","k":"リール","l":1300,"c":4,"v":1,"t":"低いパフォーマーが周囲に悪影響を与えるのか","b":"低いパフォーマーが周囲に悪影響を与えるのか、高いパフォーマーが良い影響を与えるのか、研究が行われました。\n分かったことは、高パフォーマーの約7.6m以内に座る場合、パフォーマンスが15%向上した。\n一方で、低いパフォーマーの約7.6m以内に座った場合、パフォーマンスは30%も低下したのです。\n何が言いたいかというと、ネガティブな感情はより感染しやすいということです。\n低いパフォーマーがあなたにとって何を指すかは別として\nネガティブなサイン\nつまり不安を感じている\nいつも疲れている\n自信がない人たちのエネルギーというのは\nあなたにも伝染し\n日々の生活、お仕事のパフォーマンスなど\n様々なことに影響が起こるのです\nだからこそ\n時間を共に過ごす5人にしっかり投資することが大事なのです\nその5人があなたが受け取りたいサインを発しているか確認してください\nモチベーションやいい感情を与えてくれていますか?\n一緒にいるとあなたの気持ちを軽くしてくれて\nよりいい自分でいることができていますか?\nそしてあなたも同じようにいい影響を与えられていますか?","th":"kokoro"},{"d":"2026-04-20","u":"https://www.instagram.com/p/DXWXhlHk312/","k":"カルーセル","l":272,"c":0,"v":0,"t":"（音声なしの投稿）","b":"> （音声トラックなし／静止画投稿）","th":"sonota"},{"d":"2026-04-20","u":"https://www.instagram.com/p/DXWRzswE7Kb/","k":"リール","l":1630,"c":17,"v":1,"t":"これが私たち人間の原則","b":"これが私たち人間の原則\n物を脱に扱う人は人も脱に扱います\n心が乱れていると部屋が乱れます\n挨拶を大切にする人は人に大切にされます\n落ち込むことがあった時こそ成長している証です\n人を動かすのは命令ではなく信頼\nそして素直さは人間関係の一番の潤滑油\n失敗を受け入れられる人が誰よりも早く前に進めて\n人のせいにする人は貴重な成長のチャンスを逃しています\n感謝をするということは不幸から最も遠く離れること","th":"kyoukai"},{"d":"2026-04-17","u":"https://www.instagram.com/p/DXOkFtOE0es/","k":"カルーセル","l":628,"c":4,"v":0,"t":"（音声なしの投稿）","b":"> （音声トラックなし／静止画投稿）","th":"sonota"},{"d":"2026-04-16","u":"https://www.instagram.com/p/DXMCUWNkwV9/","k":"リール","l":2037,"c":67,"v":1,"t":"心理学によると好きな色からその人の性格がおおよ…","b":"心理学によると好きな色からその人の性格がおおよそわかるそうです\n赤が好きな人は行動力があり周りを引っ張る存在\nしかし本当は立ち止まることを怖く感じていて動き続けることで不安をかき消しています\n青が好きな人は穏やかで信頼される人\nしかし心の中では一人で抱え込みやすい\n本当に頼れる場所を静かに求めています\n黄色が好きな人は青を明るくするムードメーカー\nしかし、笑顔の奥には沈黙が怖い気持ちが隠れています。\n楽しませる側でいないと不安になってしまうのです。\n黒が好きな人はミステリアスで独立心が強い。\nしかし、本当は心の内を見せるのが苦手。\n壁を作りながらも理解者を待っています。\nピンクが好きな人は愛情深く人を癒す力を持っている。\nしかし、その裏側には満たされない思いがあり、誰かに受け止めてほしいと願っています。\n緑が好きな人はバランス感覚があり周りに安らぎを届けます\nしかし人のために動きすぎて自分の心を後回しにしてしまいます\nオレンジが好きな人は社交的で冒険心があります\nしかし熱しやすく冷めやすい地面もあります\n新しいものに惹かれるあまり継続することが苦手です\nあなたは何色が好きですか?","th":"kokoro"},{"d":"2026-04-14","u":"https://www.instagram.com/p/DXG6cNBE5t-/","k":"カルーセル","l":461,"c":3,"v":0,"t":"（音声なしの投稿）","b":"> （音声トラックなし／静止画投稿）","th":"sonota"},{"d":"2026-04-14","u":"https://www.instagram.com/p/DXG3jUNExdA/","k":"リール","l":1330,"c":43,"v":1,"t":"深い心の傷が癒える瞬間とは","b":"深い心の傷が癒える瞬間とは、それを消そうとしなくなった時かもしれません。\n最近よく言われる、自分と向き合うということは確かに大切です。\nしかし、向き合うワークだけでは傷は癒えるわけではありません。\n本当に癒しが始まるのは、その傷から得た感情や学びを人生で使い始めた時。\n傷は消えるものではなく、形を変えエネルギーになる。\n深い傷は深い浄土になる\n悔しさ、孤独、怒り、悲しみ\nそれらはやがて誰かを救いたいという衝動や\n何かを作り出したいという表現欲に変わります\nただ癒そうと閉じこもるのではなく\n湧き出る何かを肉体を通して外に出していく\nそれが回復の本質\n消すのではなく生かす\nその視点に立てた時傷はあなたの弱さではなくあなたの表現の源になります","th":"kokoro"},{"d":"2026-04-12","u":"https://www.instagram.com/p/DXBsk2ckwtK/","k":"リール","l":1615,"c":10,"v":1,"t":"半年続けると多くの差が出る10個の習慣","b":"半年続けると多くの差が出る10個の習慣\n1.1日の終わりに感謝を書き出す\n2.嫌なことはきっぱり断る\n3.整理整頓をする\n4.1時間早く寝る\n5.できたことを振り返り自分を褒める\n毎日一つ新しい知識を学ぶ\n7.尊敬できる人がいる環境に身を置く\n8.不平を言うのをやめる\n9.自分から感謝をする\n10.常にあと少しだけ頑張る","th":"koudou"},{"d":"2026-04-11","u":"https://www.instagram.com/p/DW_Gz3pkyGI/","k":"リール","l":1078,"c":11,"v":0,"t":"（音声なしの投稿）","b":"> （発話なし・BGM楽曲のみ）","th":"sonota"},{"d":"2026-04-09","u":"https://www.instagram.com/p/DW59qFOEySN/","k":"リール","l":1326,"c":12,"v":1,"t":"また同じようなトラブルが起きた","b":"また同じようなトラブルが起きた\n私は運が悪い\nそう思っているのであれば\nそれは間違いです\n繰り返すトラブルは偶然ではなく\n魂からの警告\n職場を変えても同じような人間関係にあたり\n環境を変えてもまた同じような人生のパターンに陥る\nこれを運のせいにしている人が多いですが\nこれらは相手や環境が問題なのではありません\nあなたの中に繰り返す原因があるかもしれません\nしかしこれはあなたを責めているのではなく、希望の話をしています。\n自分の中に原因があるとするなら、自分で変えられるということです。\n繰り返すトラブルには必ず共通点が隠れています。\nその共通点こそが、魂があなたに気づかせたいテーマなのです。\n環境や人を変えても、魂からのサインを見逃せばまた同じことを繰り返します。\n過去のトラブルを3つ思い出し\n共通する自分の行動を探してみてください\nそのパターンに気づければ\n魂は次のステージへ進みます","th":"kyoukai"},{"d":"2026-04-04","u":"https://www.instagram.com/p/DWtFfpbE54O/","k":"リール","l":2993,"c":56,"v":1,"t":"最近このような投稿をよく見かけます","b":"最近このような投稿をよく見かけます\n朝鏡の前に立ち私は美しいや私は幸せだ私はお金持ちだ成功しているといえば\n自身の理想的な姿になれるといったいわゆるアフォメーションと呼ばれる投稿です\nアフォメーションとは自分自身に対し肯定的な自己宣言を行うこと\nもちろんこれらを否定するわけではありません\nただしこれらと一緒に必ずすべきことがあると私は思っていて\nそれは言葉と行動を一致させることです\nこれは引き寄せの法則などでも言えることで\n毎日本気で願ったのにかなわなかったと思う\nほとんどの方は信じる力が足りなかったからではなく\n言葉と行動を一致させなかったからです\n例えを簡単に言うと健康的な体になると言い\n願いながらも片手にピザと直後にケーキを食べているようなものです\nこれは認知的不協和を作り出し\n潜在意識はその言葉を否定してしまいます\n自分が毎日鏡の前で唱える言葉と\n現実の行動へのギャップが広がれば広がるほど\nモチベーションは下がる一方なのです\nなので私は成功していると\n鏡の前で願うのと同時に\n一つでもいいので\nまずは成功している誰かの習慣を行動として行います\n行動ができればそれをノートに書き記すのです\nこれはあなたが行動できた証拠となってくれます\n脳はその行動と結果を否定することができません\n例えば簡単なことからでいいです\n今日はいつもより早起きをして30分散歩をした\n早起きと30分の散歩を1週間続けられた\n早起きして空いた時間で語学の勉強ができた\nなど毎日少しずつ言葉と行動の一致を積み上げていくのです\nこれは願うことだけでは手に入れることはできない\n自信と証拠となっていってくれます\nアフォメーションや自己啓発本は、行動への第一歩として背中を押してくれるものでもありますが、最終的に現実をきちんと動かしていくのは自分自身の行動です。\n見えないエネルギーももちろん大事ですが、言葉と行動を一致させることが何より目標達成への近道だと思っています。","th":"kotoba"},{"d":"2026-04-02","u":"https://www.instagram.com/p/DWn78MSk83Q/","k":"リール","l":1701,"c":14,"v":1,"t":"人生が好転するタイミングは待っていても一生おけ…","b":"人生が好転するタイミングは待っていても一生おけません なぜなら好転は待つものではなく自分で起こすものだからです\nしかし多くの人は今はまだその時ではないと言い訳をします 約年が明けたら環境が整ったらこう言いながら何年も同じ場所に立っている人をたくさん見てきました\n少し厳しいことを言いますがタイミングを待っている間に人生は確実に消耗しているのです\nあなたは人生が本当に好転する瞬間はいつだと思いますか\nその瞬間とはもうこの現実は嫌だと心の底から思った瞬間です\n中途半端に不満を感じているうちは人は動きません\nではやるこ います\n私たちはもともと同じスタートラインに立っているという幻想の中で無意識に比較してしまうからです\nしかし現実は異なります\n育った環境、与えられる条件、今まで背負ってきたものなど\n誰一人同じではありません\nスタート地点が違う以上\n到達点だけで優劣を決めること自体がかなり乱暴な見方だと思っています\n多くの人はまだこれしかできていない\n周りはもっと先に進んでいるのに\nと自分の歩幅を否定してしまいます\nしかし本当に見るべきは\n昨日の自分からどれだけ前に進んだか\n怖さを抱えたままでも一歩を踏み出したか\n逃げずに向き合えたか\nその積み重ねこそが成長の正体です\n人の価値は数字や位置では決まりません\n進んだ距離で決まります\nその物差しで世界を見ると\n自分自身にも他の人にも\n敬意を持てるようになると思っています","th":"koudou"},{"d":"2026-01-31","u":"https://www.instagram.com/p/DUK3VVUk_Ja/","k":"リール","l":2271,"c":31,"v":1,"t":"近年、強い女性を象徴する存在が目立つようになっ…","b":"近年、強い女性を象徴する存在が目立つようになってきたと感じます。\n彼女は自立している。\n彼女は鍛えている。\n彼女は男性に勝る稼ぎがある。\nそれ自体は否定されるものではもちろんありません。\nしかし、ふと立ち止まって考えてみたとき、\n女性が強さを前面に押し出さなければならない状況そのものに違和感を感じます。\n本当に強い立場にあるとき、\n人は強さを主張しません\n男女平等や女性の社会進出が進み\n一見すると女性は生きやすく力を持ったように見えます\nだからこそ私は問いたい\n私たち女性は昔よりも強くなったのか\nそれとも強く見せなければならない場所に追い込まれただけなのか","th":"onna"},{"d":"2026-01-27","u":"https://www.instagram.com/p/DUAlGqAkyL2/","k":"リール","l":7435,"c":37,"v":1,"t":"内面は外見に現れます","b":"内面は外見に現れます\n心は目に出て\n感情は声に出る\n性格は字に出て\n教養は話し方に出る\n自信は歩き方に出て\n生活は体型に出ます\n健康は爪に出て\n育ちは食べ方に\n清潔感は歯に現れ\n美しさは姿勢に出ます\n苦労は手に出て\n生き方は顔に出ます\n優しさは表情に現れ\n幸せは笑顔に出る\nそしてその人の人生は背中に現れます","th":"kokoro"},{"d":"2026-01-25","u":"https://www.instagram.com/p/DT7a87Ik3y3/","k":"カルーセル","l":675,"c":0,"v":0,"t":"（音声なしの投稿）","b":"> （音声トラックなし／静止画投稿）","th":"sonota"},{"d":"2026-01-24","u":"https://www.instagram.com/p/DT42EDyE4wo/","k":"リール","l":2943,"c":20,"v":1,"t":"以前も紹介したことがあるこの理論","b":"以前も紹介したことがあるこの理論、ぜひ試してみてください。\nそれではあなたにテストを始めます。\n今、あなたがいるお部屋をぐるっと見回してみて、茶色いものをできる限り全部覚えてください。\n覚えたら目を閉じてみてください。\nさっき見た中で赤いものはありましたか?\n当然ながらきっと茶色い方を多く見ていたと思います。\nではもう一度目を開けて、今度は赤いものを探してみてください。\n今は赤いものがよく見えているはずです。\nなぜでしょうか?\n答えは赤いものを探しているから\nそうです\n人は何かを信じ始めると\nそれを証明するものばかりを探すようになります\n良くも悪くもないものまである\nと思い込むことまでができるようになるからです\nきっとベージュも茶色と認識し\nバーガンディだって赤色と判断したと思います\nそれと同様にもうダメだ\nしんどいと感じたことに対しても\n不思議とそういうところばかりに目について\n本当にダメなんだと信じてしまうのです\n事実かどうかではなく\nそれがあなたにとっての現実となるのです\nつまり人は信じているものを\n信じていることを自分で証明しようとします\nそしてそれを裏付けるものばかりを探すのです\n自分が見たいものだけを見るとはそういうことなのです\n4,5日だけでもいいです\n違う視点、見方をし\n意識を向ける場所を変える基準を探してみてください\nきっと人生が変わります","th":"sonota"},{"d":"2026-01-22","u":"https://www.instagram.com/p/DTzulU9k8xD/","k":"リール","l":5695,"c":56,"v":1,"t":"心が疲れにくくなる11の習慣","b":"心が疲れにくくなる11の習慣\n1.無理に合わせない\n2.必要以上に話さない\n3.無駄に気を使わない\n4.軽々と約束をしない\n5.いちいち反応しない\n6.良かれと思って動きすぎない\n7.無闇に関わらない\n8.自分を安売りしない\n9.やたらと笑顔を振りまかない\n10.闇雲に心を注がない\n11.無理に答えを探さない","th":"koudou"},{"d":"2026-01-20","u":"https://www.instagram.com/p/DTuk_DhE9-f/","k":"リール","l":3511,"c":40,"v":1,"t":"あなたがあなた自身を10%か20%しか好きでは…","b":"あなたがあなた自身を10%か20%しか好きではないとき、25%や30%の愛をくれる人があなたの前に現れたら、きっとこれが本当の愛だと思ってしまいます。\nしかし、自分を50%愛して大事にしていられるようになると、25%しか愛を与えられない人はきっと最初から選択肢にすら入ってこないと思います。\nでは100%自分を愛して大切にしていたらどうでしょうか\n100%愛してくれる人しかあなたの人生に入ってこれないと思います\nいつも皆様にお伝えしています\nまずは自分を愛す\nそこから周りに伝染していき\n同じような仲間や愛する人たちの輪が広がっていきます","th":"jibun"},{"d":"2026-01-18","u":"https://www.instagram.com/p/DTpZfYlk6Vk/","k":"カルーセル","l":450,"c":11,"v":0,"t":"（音声なしの投稿）","b":"> （音声トラックなし／静止画投稿）","th":"sonota"},{"d":"2026-01-16","u":"https://www.instagram.com/p/DTkRPrIE4ft/","k":"リール","l":2081,"c":20,"v":1,"t":"自分に返ってくること","b":"自分に返ってくること\n人に優しくすると困った時に助けてもらえます\n努力を続けると自信につながる\n悪口を言うと信頼を失いますが\n笑顔を心がけると周りも明るくなります\nそしてポジティブな言葉を使うと\n前向きな出来事を引き寄せ\n小さなことに感謝すると\n幸せを感じやすくなります\n素直に謝ると関係が深まり\n正直でいると周りからの信頼が深まる\n感謝を伝えると自分も感謝されます\n他人と比べないようにすると心が穏やかになります","th":"yutakasa"},{"d":"2026-01-13","u":"https://www.instagram.com/p/DTciMotk9eO/","k":"リール","l":1830,"c":17,"v":1,"t":"欲望が満たされないと感じて苦しくなる人は","b":"欲望が満たされないと感じて苦しくなる人は、足りないものを増やせばいつか満たされるという前提そのものに強く縛られていることが多いです。\n何かを手に入れれば安心できる、もっと評価されれば幸せになれる、そう信じて走り続けても満足はいつも少しその先にあります。\nなぜなら欲望は満たされることで静まるのではなく、刺激されることでさらに増えていく性質を持っているから、人は2つの方向で満たします。\n一つは足りないを起点に外側から埋め続ける生き方\n成果、承認、所有を増やすことで安心しようとします\n二つ目はすでにあるものに気づき\nそれを感じる力を育てていく生き方\n前者は成長や生産を加速させます\nしかし同時に欠乏感も膨らませてしまいます\n後者は派手さはありませんが\n心の奥に静かな満足を根付かせていきます\n日常の小さな安心\n当たり前にある幸せ\n失っていない部分に目を向ける感覚が育つと\n欲望は暴れなくなります\n追いかけなくとも自分の内側にもう足りているという感覚が生まれるからです\nこれらの循環に入ると焦りではなく選択として動けるようになります\n豊かさとは得る量ではありません\n感じ取れる深さの問題です","th":"koudou"},{"d":"2026-01-10","u":"https://www.instagram.com/p/DTU1L2NE82q/","k":"リール","l":7055,"c":48,"v":1,"t":"掃除をすると運が良くなると思っていたのですが","b":"掃除をすると運が良くなると思っていたのですが、順番を取り違えていたことに気づいたことがあります。\n整った暮らしが幸運を呼ぶのではなく、整えられる状態にあること、そのものがすでに健やかなサインなのです。\nそもそも、片付けに手を伸ばせるということは、体力に削られないこと、思考がある程度クリアであること、\nそして今少し動けば後が楽になる\nと見通す余白が残っていること\nこれは心と生活のバランスが最低限きちんと保たれている証拠でもあります\nお掃除は魔法でも儀式でもありません\nただ運気の高い人は日常の摩擦が少ない\n例えば探し物に追われにくく忘れ物が減り動線が単純になります\nそして判断・選択の回数も減ります\nその結果時間や気力が無駄に削られず\n物事が滞らない状態が生まれるのです\nいわゆる運がいい人に見える現象は\nこうした小さな摩擦の少なさが積み重なった結果だと思っています\n逆に片付けができないときは怠けているのではなく\n余力が底をついているだけのことも多いのです\n整えられない自分を責めるのではなく\nまずは今整えられる余裕すらないんだと\n気づくこと自体が回復の入り口になります\n環境が整うと人生が動き出すのではなく\n人生が少し整い始めたサインとして環境が整い出す\n掃除は運気を呼ぶ行為ではなく\n自分の状態を映す静かな鏡なのです","th":"karada"},{"d":"2026-01-08","u":"https://www.instagram.com/p/DTPp7NXk_sI/","k":"リール","l":2399,"c":22,"v":1,"t":"あなたが欲しいのに今まだ手に入っていないものは…","b":"あなたが欲しいのに今まだ手に入っていないものはすべてコンフォートゾーンの外にあります\n私が成長の過程で学んだのはどの段階にも必ず代わりに手放すものがあるということです\n人生の重要な節目で次のレベルに行きたいと思うならただ前に進むだけでは到達できません\n上に行くためには、何かを手放す必要があると理解して初めて進むことができるのです。\nそして、これはどこまで行っても同じで、上に行けば行くほど手放すものは大きくなります。","th":"tebanasu"},{"d":"2026-01-06","u":"https://www.instagram.com/p/DTKhBHlk_JD/","k":"リール","l":19470,"c":66,"v":1,"t":"医師が断食について話さないのは","b":"医師が断食について話さないのは、もしみんながそれを始めたら、医療業界が多額の損失をかぶるからです。\n何もしないことには利益が発生しません。\n栄養士や医師はビジネスとして成立しなくなります。\n断食は力や薬、処方箋を必要としません。\n特定の時間食べないという単純な行為でありながらも、科学が認める最も強力な代謝をリセットする一つの方法なのです。\n断食をすると、インスリンのレベルが下がります\n体は脂肪を燃焼し、細胞の掃除を始めます\nオートファジーが働き、体が損傷した細胞を再利用し始めるのです\nこれはリセットボタンを押すようなもので、薬にはできないことです\nただ、薬をすべて否定しているわけではありません\n断食はあなたの体が本来行うべきことをするスペースを与えてくれます\n現代の世界で人々は血糖値とインスリンの急上昇を引き起こす食生活を続け\n自然な修復ができなくなっているのです\n人々に自分自身を癒す方法を教えることには利益が生じません\nだからこそ断食を行ってみることをお勧めします","th":"karada"},{"d":"2025-12-29","u":"https://www.instagram.com/p/DS16iKDk5ZR/","k":"カルーセル","l":513,"c":0,"v":0,"t":"（音声なしの投稿）","b":"> （音声トラックなし／静止画投稿）","th":"sonota"},{"d":"2025-12-27","u":"https://www.instagram.com/p/DSwwpMdE-pa/","k":"リール","l":2279,"c":30,"v":1,"t":"人生はたった一日だけです","b":"人生はたった一日だけです。\nあなたはある一日に生まれ、ある一日を生き、そしてある一日で死にます。\nすべての出来事は一日の中で起こります。\n今日こそがあなたの唯一の人生、明日はまだ生まれて、人生そのものなのです。\nだから私たちは今この瞬間\n一日一日を楽しく健康に幸せに生きなければなりません\n来年こそは幸せになろうと考えるのはやめましょう\n幸せな今日この瞬間を生きたのなら\nそれはすでに幸せな人生なのです","th":"karada"},{"d":"2025-12-23","u":"https://www.instagram.com/p/DSmclTSE_E4/","k":"リール","l":2008,"c":20,"v":1,"t":"自分が何者かわからない","b":"自分が何者かわからない、そう感じている人は、まだ他人の言葉で生き、自分を説明しようとしているのかもしれません。\nあなたは優しいね、真面目だね、頑張り屋さんだね、そう言われることで自分の輪郭を確かめて生きてきた。\nしかし、他人の言葉で作られた自己像は、少しでも評価が変わるとすぐに揺らいでしまい、不安になります。\n本当の自己理解とは、誰にどう説明しようという発想そのものが消えていくこと。\n分かってもらいたいではなく\n私はこれでいいという静かな確信に変わる瞬間です\nそれは自分の内側に他人の評価を挟む余白がなくなるということ\n自分自身が自分を一番よく分かっている\nその感覚にたどり着くと\n人に説明する必要がなくなります\n自己理解が深まるとは\n孤独を恐れなくなることでもあります\nただここにいる\nそれだけでも十分なのです","th":"kyoukai"},{"d":"2025-12-19","u":"https://www.instagram.com/p/DScPKpYE1A5/","k":"リール","l":3766,"c":17,"v":1,"t":"あなたは疲れているのではありません","b":"あなたは疲れているのではありません。ただ、ワクワクしていないだけです。\n例えば、ネットフリックスを夜中の2時まで見たり、SNSの動画を永遠とスクロールしたり、\n友達たちと遅くまで遊んでも平気なのに、いざ自分の夢や目標に取り組もうとすると、なぜか急に疲れたと感じる。\nこの疲れに必要なのは、もっと寝ることでも、長い休暇でもありません。\n必要なのは目的なのです\n人はやる意味を感じられないことをしているときに疲れるのです\nただ生活費のために働く仕事はしんどく感じ\n自分にとって大切なことに取り組むと不思議とエネルギーが湧いてくることを実感したことはありませんか?\n家族や友人、自分の趣味に没頭する3時間は疲れを感じない\nしかしビジネスを作る30分がすごく重く感じるのもそのせいです\n問題は体力ではありません\n問題は何に意識を向けているかなのです\n本当に大事なものを見つけてそこに向かえば\nもう惰性で生きる必要なんてなくなります\nそして自分でも信じられないくらいの力で\n走り出すことができるようになります","th":"kokoro"},{"d":"2025-12-15","u":"https://www.instagram.com/p/DSR7Y8IE9rH/","k":"リール","l":1703,"c":18,"v":1,"t":"責任感は自己愛の最高の形です","b":"責任感は自己愛の最高の形です。\nどういうことかというと、外側を気にしないということ。\n外側で何が起きていても、誰かが何かをしたり、何もしなくとも気にしないのです。\n私たちがコントロールできているのは何でしょう?\nそれは、自分自身の視点、自分自身のエネルギー、そして自分自身のご機嫌。\n内側にあるすべてのことに完全に責任を持つのです\n他人に私たちの内面の世界を支配させることは絶対にありません\nこれを別の言葉では主権と言います\n私たちは主権を持って歩み始めるとき\n誰もあなたをコントロールすることはできません\nこれを実現するとあなたは\n自分が現実の創造者であることに気づき\n他人が望むようにではなく\n自分自身が望むように現実を想像し始めることができます","th":"tebanasu"},{"d":"2025-12-10","u":"https://www.instagram.com/p/DSE-Fysk1KB/","k":"リール","l":1963,"c":15,"v":1,"t":"外側をいくら良くしようとしても内側が変わらない…","b":"外側をいくら良くしようとしても内側が変わらない限り何も意味がありません\n実際のところ人生は内側から外側に向かって体験しているから\n皆さんが気づいていないのは人生というのは自分の視点からの解釈に過ぎないということ\nつまり外の世界で何が起きていても何かをいい感じにしたり\nよく見せたりしても内面の解釈によって感じ方が変わります\nなので、過去の傷を癒したり、歪んだ自己概念を整理したり\n無意識の中にある傷を修復しない限り\nどんなに立派な家を建てても、素敵な車を買っても\nどれだけ銀行にお金があっても、内側ではちっぽけにしか感じないのです\nまた逆もしかり、外側に何も持ってなくても\n内側には全てがある、という状態\nこれこそが本当の豊かさなのです\n内側に全てを持っていることを知ったとき、外側にあるものでは得られない満足感を知ることが豊かであるということなのです。\nいつも私もお伝えしています。大事なのは心の在り方。","th":"yutakasa"},{"d":"2025-12-07","u":"https://www.instagram.com/p/DR9QSTOE8lM/","k":"カルーセル","l":358,"c":4,"v":0,"t":"（音声なしの投稿）","b":"> （音声トラックなし／静止画投稿）","th":"sonota"},{"d":"2025-12-06","u":"https://www.instagram.com/p/DR6ramJky9E/","k":"リール","l":2846,"c":32,"v":1,"t":"変わりたいのに変われないのは","b":"変わりたいのに変われないのは 覚悟が足りないからではありません\nただ まだ動いていないだけなのです\n多くの人は覚悟は決まったら動ける 気持ちを整えてから始めるべき\nしかし これは真逆で 人間の心は決意してから動くのではありません\n動いた後に決意が生まれるようにできています\n一歩踏み出した瞬間 脳はこう判断します\nこれは自分が選んだ行動なんだ\nその後付けの意味付けがあなたの中に覚悟という火をつけます\nなので覚悟は最初から持てるものではありません\n行動の結果として湧いてくる反応なのです\n動けないまま悩んでいる人ほど覚悟が弱いわけではありません\nただ一歩目が止まっているだけなのです\n止まったままの心は永遠に自分を決められません\n1ミリでも動いた途端脳は薄むモードに切り替わります\nなので変わりたいあなたに必要なのは\n気合でも完璧な計画でもありません\n最初の小さくそしてぎこちない一歩だけで十分なのです","th":"koudou"},{"d":"2025-12-04","u":"https://www.instagram.com/p/DR1mPxFEyi-/","k":"リール","l":2098,"c":22,"v":1,"t":"1日の終わり、眠りにつく前の5分","b":"1日の終わり、眠りにつく前の5分、そのわずかな時間こそが、あなたの1日の中で最も大切な時間です。\nあなたはこれから8時間ほど潜在意識の中に入り込み、そこに留まることになります。\nその入り口で私たちはつい考えてしまいます。\n嫌だったこと、うまくいかなかったこと、失望したことを、しかしその時間を再構築に使ってみてください。\nその5分間、こう自分に語りかけるのです。\n私はうまくやっている\n私は健康だ\n私は満たされている\n私は穏やかだ\n私は自由で愛を感じている\nこうして自分をプログラミングし始めると\n朝目が覚めた時\nあなたの潜在意識は\n思考と現実の違いを感じなくなっていきます\n今日からぜひ実践してみてください","th":"kotoba"},{"d":"2025-12-03","u":"https://www.instagram.com/p/DRy9a4xkx2e/","k":"カルーセル","l":289,"c":4,"v":0,"t":"（音声なしの投稿）","b":"> （音声トラックなし／静止画投稿）","th":"sonota"},{"d":"2025-12-02","u":"https://www.instagram.com/p/DRwYge_k7qj/","k":"リール","l":397,"c":4,"v":0,"t":"（音声なしの投稿）","b":"> （発話なし・BGMのみ）","th":"sonota"},{"d":"2025-12-01","u":"https://www.instagram.com/p/DRtzavRExWQ/","k":"リール","l":4081,"c":43,"v":1,"t":"今、皆さんのお部屋は綺麗な状態ですか?","b":"今、皆さんのお部屋は綺麗な状態ですか?\n机の上はどうですか?\n椅子に洋服やいろんなものが積まれたりしていないですか?\nこのようなことをどうでもよく思うのなら、\n今日から考えを変えること いい自分でいることができていますか?\nそしてあなたも同じようにいい影響を与えられていますか?","th":"kokoro"},{"d":"2025-07-01","u":"https://www.instagram.com/p/DLj1Qr0TikD/","k":"リール","l":799,"c":11,"v":1,"t":"皆さんこんばんは魔女です","b":"皆さんこんばんは魔女です 今夜はオンラインショップ絵西の新月オープン時の梱包の様子を皆様にお届け\n毎月満月と新月にオープンしているオンラインショップ絵西ですが 女性たちが月の暦とともに生きるきっかけとなればいいなという気持ちで続けてきました\n商品や作品たちも月を連想させるようなものも多く作っています そしてこれまでに女性にはもちろんたくさんの方に手を取っていただきましたが\nエニシオは製作から発想の過程まで\n動物や環境に配慮したもので作り上げ\n皆様のもとへ送り出しています\n日々の癒しとなるように\nご自身を一番に愛し大切にできるように\n新たな挑戦や出会い経験へと導けるように\nそして生きとし生けるもの\nすべてが幸せになるように\nという願いを込め\n製作から発想まで行っています\nその思いが皆様にも伝わっていると嬉しいです\nいつもエネルギーや時間を使って\n手にしの商品や作品たちを選んでくださる皆様\n本当にありがとうございます\nこれからも愛をたっぷり込めて\n皆様のもとへお届けします","th":"karada"},{"d":"2025-06-28","u":"https://www.instagram.com/p/DLcINmezTLH/","k":"リール","l":4952,"c":49,"v":1,"t":"出すものは帰ってきます","b":"出すものは帰ってきます\nそれが法則なのです\nあなたがどう表現しどう定義するかによって\nそれをあなたが経験することになります\nうわぁなんだか大変なことになりそう\nそう思っていればそうなります\n宇宙はあなたが大変だと信じるなら\n無条件にサポートするよと言います\nなぜなら宇宙は無条件だからです\nこれは苦労しそう\nしんどそう\n試練になりそう\nきっと大変だ\nそんなあなたに宇宙は言います\nそうだね\nしかしもしこれはすごくいい経験になる\n面白い\nワクワクする\nこれは私の成長に必要なものなんだ\nチャンスなんだとあなたが言うと\n宇宙はそうだねと言います\n私も何度も言ってきていますが\nあなたが発する言葉がそのまま現実となります\nそれこそがあなたの力です\nあなたに与えられた最高の贈り物は\n選択する力です\nどうか賢く選択してください","th":"kotoba"},{"d":"2025-06-26","u":"https://www.instagram.com/p/DLXBkWbTFaT/","k":"リール","l":7575,"c":73,"v":1,"t":"頭の中で想像できることは現実化します","b":"頭の中で想像できることは現実化します。\n潜在意識はわからないのです。\n想像と現実の違いが、理解できている人も多いと思いますが、\n初めてこのことを聞くときは理解が難しいかもしれません。\nなぜ脳が現実と想像の区別をつけることができないのか、\nとても簡単に説明してみます。\nまず第一に、脳に目はありません。\nだから見えないのは理解できますよね。\nそう、脳は盲目です。\nしかし、感じることはできます。\nなので、あなたが何かを想像しているとき、その夢が叶うことを感じ、\n全身でその興奮状態を味わいますが、脳には区別がついていません。\nそれらが外側の現実で起きているのか、それとも想像しているだけなのか。\nアインシュタインも言っています。\n想像力に意識を向けるように、と。\n想像の中で思い描くことができるのなら\nそれは現実であり達成可能なことなのです\n私たちは目に見えないものを信じることができるなら\n感覚を感じ取り\n望むものはもうすでに手に入れていると\n脳に納得させることができれば\nもうお分かりですよね\n私たちが想像できることは現実化します","th":"kotoba"},{"d":"2025-06-19","u":"https://www.instagram.com/p/DLE7Mz7zu8C/","k":"リール","l":824,"c":11,"v":1,"t":"今あなたは大勢の観客の中の一人で客席に座ってい…","b":"今あなたは大勢の観客の中の一人で客席に座っています\nそしてある男があなたが欲しいと思っていたものを手に持ち\nこれを手に入れたいと思う人はここにいますか?と尋ねます\n大勢の人はその場で手を挙げていました\nあなたもそうです\nしかしその中のたった一人だけ席を離れ\n男の持つそのものを取りに向かいました\nそしてそれを受け取った彼女は\n大勢の人との違いがはっきりしています\n欲しいものがあったので客席から立ち上がり\n実際に行動したというとこです\n多くの人は座ったまま\n希望を抱き夢を見て\n自己暗示をし\n祈って瞑想をし\nそういったことを続けます\n確かにこれらも大切な要素の一つかもしれません\nしかしある瞬間\n一瞬でチャンスはやってきます\nその時に行動せず\nただ客席に座っているだけでは手に入れたいものは手に入りません\n私の知っている成功している人のほとんどは行動している人たちです","th":"koudou"},{"d":"2025-06-17","u":"https://www.instagram.com/p/DK_8lwezBiZ/","k":"リール","l":1305,"c":21,"v":1,"t":"体が健康的な時っていろんな悩みがあると思います","b":"体が健康的な時っていろんな悩みがあると思います\nしかし体が病めば悩みは一つになります\n体が健康でなければ他のことを心配する余裕すらなくなります\n少しでも頭が痛かったりお腹が痛かったり\n熱が出て日々の生活が当たり前に遅れなくなった時に\n健康的な体のありがたみを感じると思います\n誰よりも自分自身の体を敬い大切にし愛します\n今この瞬間体が健康であることがどれだけかけがえのないことか\nそれを理解できるように自分自身を丁寧に養ってください","th":"karada"},{"d":"2025-06-14","u":"https://www.instagram.com/p/DK4DdaATjhV/","k":"リール","l":2873,"c":25,"v":1,"t":"私たちはいかに話さないことが大事か見極める必要…","b":"私たちはいかに話さないことが大事か見極める必要がある時があります\n何を話すかより何を言わないか\n気になったことをすぐ聞いたり\n思ったことをすぐ口に出したり\n自分が気になっていることでも\n相手からすれば触れてほしくない領域もある\n沈黙も会話のうち\n沈黙は気まずさではなく\n信頼を育てる間になることもある\nそして相手との心の距離の察する力こそが\n大人の気配りでもあり思いやりでもあります","th":"kokoro"},{"d":"2025-06-10","u":"https://www.instagram.com/p/DKtxZVNzBH5/","k":"リール","l":1212,"c":21,"v":1,"t":"学校や職場の人から傷つくことを言われた","b":"学校や職場の人から傷つくことを言われた\n誰もがきっと経験したことがあると思います\nこのようなことが起こったとき私はこれらを絶対に受け取りません\n受け取らなければプレゼントや配達物のように送り主のもとへ戻るから\nそう因果応報です\nあなたに向けられた言葉も行動も受け取らなければ全て相手に変えていきます\nそして私はその相手や環境から離れる選択もします\n環境を変えることって案外難しくないんです\nあなたの苦手なあの人にも幸せの輪が届きますように","th":"kyoukai"},{"d":"2025-06-07","u":"https://www.instagram.com/p/DKmDEp4z1Be/","k":"リール","l":8668,"c":79,"v":1,"t":"ある人から教えてもらいました","b":"ある人から教えてもらいました\n空のバケツほど蹴るとうるさい\nどういう意味かというと\n中身が空っぽの人ほど\n何か刺激をすると人への批評や\n不平不満を言います\nなので水のたくさん入ったバケツのように\n中身の詰まったどっしり構えた人になりなさい\nいろいろな経験や様々な人の考えに触れると\nその経験値が自分にたまり\n人に優しくそしてメンタルも安定します","th":"kokoro"},{"d":"2025-06-05","u":"https://www.instagram.com/p/DKg-Y6CTVv5/","k":"リール","l":1755,"c":15,"v":1,"t":"誰かがあなたから離れていくのは","b":"誰かがあなたから離れていくのは\nその人はもうあなたには必要がないから\n悲しかったり苦しかったりするかもしれない\nしかし離れていった人を固執し\n何か私が悪いことをしたのかと自 た太陽周期に基づいた働き方だと、月の周期で動く女性の体や心が不調になるのは当たり前なのです。\n現代の女性たちが月の暦を意識して、心穏やかに自分の好きなことで生きて、心身ともに休める豊かな環境で生きていけば、世の中の問題はほとんどが解決すると思っています。\n満潮や寒潮、満月新月と同じサイクルで生理や排卵が起こり\n女性たちのエネルギーを解放し\n本来のニュートラルな自分に戻れるよう\n月の暦と生きる\n私は自分の作る商品や発信を通して\n美しい女性の皆さんが\n月の暦を意識した生き方のお手伝いができればと思っています","th":"karada"},{"d":"2025-05-18","u":"https://www.instagram.com/p/DJypvIJz4iM/","k":"リール","l":1342,"c":22,"v":1,"t":"自分の理想的な場所で暮らすにはどうしたらいいで…","b":"自分の理想的な場所で暮らすにはどうしたらいいですか?\nこのようなご相談をよくいただきます。\n私も今まで自分が望むいろんな国、土地、環境で暮らしてきましたが、\nいつも共通していたことは、リアルに思い描き、決断し、行動していたということです。\nいつかできますように、ではなく、絶対そうなると思い、行動していました。\n私がこの宇宙のルールに気づいたのはまだ子供の頃、\n小学校3年生の時にモナコにバレー留学をすると両親に放ちました\nそれから数年が経ち中学生の時にある方から\n今度モナコでオーディションがあるから参加しない?\n連れて行ってあげるよとひょんなご縁とタイミングで\nモナコへ単身バレー留学をすることが決まったのです\nなぜこのお話をしたかというと\n漠然とした海外に行きたいなぁだったり\nアメリカやヨーロッパという大雑把な括りではなく\n小学生の少女が必ず行くんだと思い込んだモナコへ\n日本人のバレリーナが行くことがどれだけ難しく\nしかしながらそう願いが叶ったという事実を皆さんにお伝えしたかったからです\n世の中では引き寄せなんて言葉をよく聞きますが\n心から自分が望むことに対して\n無意識かつ意識的にその望みに近づくように\n自分で動いていると私は感じています\n何もせずに待つだけでは理想とする暮らしや夢はやってきません\n人一倍努力をし、巡り合うご縁やタイミングを見極め、選択をする。\nいつでも動けるように準備をし、決断をした時に気づいたらかなっています。\n今まで思い返すとそんなことがたくさん起こっていました。\nその体験談はまた今度、どんなことをしていたかも合わせてご紹介できればと思っています。\n皆さんもこのような不思議引き寄せ体験をお持ちでしたら、ぜひコメントで教えてください。","th":"kotoba"},{"d":"2025-05-17","u":"https://www.instagram.com/p/DJv8d_tTECk/","k":"リール","l":7957,"c":81,"v":1,"t":"いつもどんな食事をとっていますか?","b":"いつもどんな食事をとっていますか?\nこんなご質問をよくいただきます。\n私は1日1食、基本的に11歳の食事をいただきます。\n日本の昔ながらの和食がほとんどです。\nまた私は菜食なので、お肉、お魚もとりません。\nプラスで4毒抜きもしているので、小麦、乳製品、お砂糖、油もとりません。\nそんな私の食事を今夜はご紹介。\nこの日は天気も良く畑仕事を朝から昼過ぎまでしていたので、早めに温泉に浸かりました。\n涼しさを感じられるような薬味を食べたくて、今夜はゴミ薬味と冷ややっこでご飯をいただこうと思います。\nゴミ薬味とは、血液をサラサラにする青ネギ、免疫力を高める大葉、ホルモンバランスを整える苗が、疲労回復に効果抜群の貝割れ、食欲増進に効く生姜を一緒にしたものです。\n材料さえあればとても簡単などんべりです\nそれぞれの材料をみじん切りにし、水にさっと通します\nご飯をよそって、冷ややっこ、薬味を入れます\n味付けもお好みで、私はお醤油をかけていただきます\nこれからどんどん暑くなりますね\n水分をしっかりとり、体の欲する良いものを、良い食べ物を口にし\n暑い夏を乗り越えていきましょう\nそれではいただきます","th":"karada"},{"d":"2025-05-13","u":"https://www.instagram.com/p/DJloO0QTP7a/","k":"リール","l":884,"c":11,"v":1,"t":"今夜は満月、種まきをしました","b":"今夜は満月、種まきをしました。\nよくフォロワーさんから、\n <script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const THEMES = JSON.parse(document.getElementById('themes').textContent);
const TH = Object.fromEntries(THEMES.map(t => [t.k, t]));
const view = document.getElementById('view');
const $ = s => document.querySelector(s);

const KEY = 'nemurimajo_marks';
const load = () => { try { return new Set(JSON.parse(localStorage.getItem(KEY) || '[]')); } catch (e) { return new Set(); } };
const save = s => localStorage.setItem(KEY, JSON.stringify([...s]));
let marks = load();

let state = { tab: 'home', theme: null, q: '', open: null };

function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function jpDate(d){ const [y,m,dd] = d.split('-'); return `${y}.${+m}.${+dd}`; }

function mdToHtml(md){
  const blocks = [];
  let cur = [];
  for (const line of md.split('\n')) {
    if (line.trim() === '') { if (cur.length) { blocks.push(cur); cur = []; } }
    else cur.push(line);
  }
  if (cur.length) blocks.push(cur);

  let html = '';
  for (const b of blocks) {
    const first = b[0].trim();
    if (first.startsWith('>')) {
      html += `<blockquote>${esc(b.map(l => l.replace(/^>\s*/, '')).join(''))}</blockquote>`;
      continue;
    }
    if (/^\d+[.．、]\s*/.test(first)) {
      const items = b.filter(l => /^\d+[.．、]\s*/.test(l.trim()))
        .map(l => `<li>${esc(l.trim().replace(/^\d+[.．、]\s*/, ''))}</li>`).join('');
      const rest = b.filter(l => !/^\d+[.．、]\s*/.test(l.trim()));
      html += `<ol>${items}</ol>`;
      if (rest.length) html += `<p>${rest.map(esc).join('<br>')}</p>`;
      continue;
    }
    html += `<p>${b.map(esc).join('<br>')}</p>`;
  }
  return html;
}

function postCard(e){
  const t = TH[e.th];
  const i = DATA.indexOf(e);
  const on = marks.has(e.u);
  return `
  <div class="card post">
    <div class="meta">${jpDate(e.d)}　${esc(e.k)}</div>
    <h2>${esc(e.t)}</h2>
    <span class="chip">${t.i}　${esc(t.n)}</span>
    <div class="rule"></div>
    <div class="body">${mdToHtml(e.b)}</div>
    <a class="link" href="${e.u}" target="_blank" rel="noopener">元の投稿をInstagramで見る →</a>
  </div>
  <div class="pager">
    <button ${i >= DATA.length - 1 ? 'disabled' : ''} onclick="openAt(${i + 1})">← 前の投稿</button>
    <button class="mark ${on ? 'on' : ''}" onclick="toggle('${e.u}')">${on ? 'しおりを挟んだ 🔖' : 'しおりを挟む'}</button>
    <button ${i <= 0 ? 'disabled' : ''} onclick="openAt(${i - 1})">次の投稿 →</button>
  </div>`;
}

function row(e){
  const t = TH[e.th];
  const bk = marks.has(e.u) ? '<span class="bk">🔖</span>' : '';
  const i = DATA.indexOf(e);
  return `<div class="row" onclick="openAt(${i})">
    <span class="dt">${jpDate(e.d)}</span>
    <span class="tx">${esc(e.t)}<span class="sub">${t.i} ${esc(t.n)}</span></span>${bk}</div>`;
}

function setTab(tab){
  state.tab = tab; state.open = null; state.theme = null;
  for (const [k, id] of Object.entries({home:'t-home', all:'t-all', search:'t-search', mark:'t-mark'})) {
    document.getElementById(id).classList.toggle('on', k === tab);
  }
  render(); window.scrollTo({ top: 0 });
}
function openAt(i){
  if (i < 0 || i >= DATA.length) return;
  state.open = i; render(); window.scrollTo({ top: 0, behavior: 'smooth' });
}
function toggle(u){
  marks.has(u) ? marks.delete(u) : marks.add(u);
  save(marks); render();
}
function backName(){
  if (state.theme) return TH[state.theme].n + 'の一覧';
  return { home:'項目の一覧', all:'ぜんぶの一覧', search:'検索結果', mark:'しおり' }[state.tab];
}
function goBack(){ state.open = null; render(); window.scrollTo({ top: 0 }); }

function render(){
  if (state.open !== null) {
    view.innerHTML = `<button class="back" onclick="goBack()">‹ ${backName()}にもどる</button>`
      + postCard(DATA[state.open]);
    return;
  }
  if (state.tab === 'home') {
    if (state.theme) {
      const t = TH[state.theme];
      const list = DATA.filter(e => e.th === state.theme && e.v);
      view.innerHTML = `<button class="back" onclick="state.theme=null;render();window.scrollTo({top:0})">‹ 項目の一覧にもどる</button>
        <div class="head"><div class="nm">${t.i}　${esc(t.n)}</div><div class="ds">${esc(t.s)}　／　${list.length}件</div></div>
        ${list.map(row).join('')}`;
    } else {
      const cards = THEMES.map(t => {
        const n = DATA.filter(e => e.th === t.k && e.v).length;
        if (!n) return '';
        return `<div class="theme" onclick="state.theme='${t.k}';render();window.scrollTo({top:0})">
          <span class="ic">${t.i}</span><div class="nm">${esc(t.n)}</div>
          <div class="ct">${n}件</div><div class="ds">${esc(t.s)}</div></div>`;
      }).join('');
      const pool = DATA.filter(e => e.v);
      view.innerHTML = `<div class="label">読みたい項目をえらぶ</div><div class="themes">${cards}</div>
        <button class="omakase" onclick="openAt(DATA.indexOf(POOL[Math.floor(Math.random()*POOL.length)]))">✦ 今日の気分で、おまかせの一編をひらく</button>`;
      window.POOL = pool;
    }
    return;
  }
  if (state.tab === 'all') {
    const list = DATA.filter(e => e.v);
    view.innerHTML = `<div class="label">新しい順に ${list.length}件</div>` + list.map(row).join('');
    return;
  }
  if (state.tab === 'search') {
    view.innerHTML = `<div class="search"><input id="q" type="search" placeholder="ことばで さがす" value="${esc(state.q)}"></div><div id="res"></div>`;
    const input = $('#q');
    input.addEventListener('input', () => { state.q = input.value; results(); });
    results(); input.focus();
    return;
  }
  if (state.tab === 'mark') {
    const list = DATA.filter(e => marks.has(e.u));
    view.innerHTML = list.length
      ? `<div class="label">しおりを挟んだ ${list.length}件</div>` + list.map(row).join('')
      : '<p class="hint">まだ、しおりはありません。<br>気になった一編をひらいて「しおりを挟む」を押すと、ここに集まります。</p>';
  }
}

function results(){
  const q = state.q.trim();
  const box = $('#res');
  if (!box) return;
  if (!q) {
    box.innerHTML = '<p class="hint">本文のことばで探せます。<br>例：「境界線」「お金」「呼吸」「月」</p>';
    return;
  }
  const hits = DATA.filter(e => e.v && (e.t.includes(q) || e.b.includes(q)));
  box.innerHTML = hits.length
    ? `<div class="label">${hits.length}件 見つかりました</div>` + hits.map(row).join('')
    : '<p class="hint">見つかりませんでした。<br>別のことばでお試しください。</p>';
}

document.getElementById('t-home').onclick = () => setTab('home');
document.getElementById('t-all').onclick = () => setTab('all');
document.getElementById('t-search').onclick = () => setTab('search');
document.getElementById('t-mark').onclick = () => setTab('mark');
render();
</script>
</body>
</html>
